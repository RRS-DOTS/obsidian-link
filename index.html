<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in Obsidian</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; margin: 3rem auto; max-width: 42rem; padding: 0 1rem; color: #1a1a1a; }
  code { background: #f2f2f2; padding: 0.1rem 0.3rem; word-break: break-all; }
  a.button { display: inline-block; margin-top: 1rem; padding: 0.5rem 1rem; background: #6c31e3; color: #fff; text-decoration: none; border-radius: 4px; }
</style>
</head>
<body>
<h1>Open in Obsidian</h1>
<p id="message">Obsidian is being opened.</p>
<p><a id="open" class="button" href="#">Open in Obsidian</a></p>
<p>The note is opened in the vault that is active in Obsidian. The link works for the DOTS team vault on its own and for the team vault inside a personal vault.</p>
<script>
  // Only builds obsidian://open links. The parameter "file" is the path of the note
  // from the root of the team vault, without the extension .md.
  var params = new URLSearchParams(window.location.search);
  var file = params.get("file");
  var message = document.getElementById("message");
  var button = document.getElementById("open");
  if (!file) {
    message.textContent = "The link contains no note. Expected: ?file=<path of the note>";
    button.style.display = "none";
  } else {
    var target = "obsidian://open?file=" + encodeURIComponent(file);
    button.href = target;
    message.innerHTML = "Obsidian is being opened with the note <code></code>.";
    message.querySelector("code").textContent = file;
    window.location.replace(target);
  }
</script>
</body>
</html>
